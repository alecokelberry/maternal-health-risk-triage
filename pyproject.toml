[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maternal-health-risk-triage"
version = "1.0.0"
description = "Classify maternal health risk from six routine vitals. A portfolio demo, not a diagnostic device."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alec Okelberry" }]
# Ranges for library use. requirements.txt pins the exact versions the
# shipped model was trained with.
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["ruff==0.16.10", "mypy==2.4.0", "pytest==9.1.1", "pandas-stubs"]

[tool.setuptools]
packages = ["triage"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["triage", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
