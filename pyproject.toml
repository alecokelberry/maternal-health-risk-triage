[project]
name = "maternal-health-risk-triage"
version = "1.0.0"
description = "Rank follow-up priority from routine maternal vitals. Not a diagnostic device."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alec Okelberry" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[tool.setuptools]
packages = ["triage"]
